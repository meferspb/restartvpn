name: ci

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Build, test and package
        shell: pwsh
        run: ./scripts/build.ps1 -Dotnet dotnet

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: RestartVPN
          path: |
            dist/RestartVPN-*.exe
            dist/RestartVPN-*.sha256
          retention-days: 14